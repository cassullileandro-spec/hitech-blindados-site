        <div class="fgroup">
          <label for="f-search">Buscar veículo</label>
          <input type="search" id="f-search" class="f-select" placeholder="Ex: Porsche, SUV, Corolla...">
        </div>

        <details class="stock-refinements" id="stock-refinements" open><summary>Refinar por marca, preço e mais</summary>
        <div class="fgroup">
          <label>Marca</label>
          <div id="f-marcas"></div>
        </div>

        <div class="fgroup">
          <label>Carroceria</label>
          <div id="f-carrocerias"></div>
        </div>

        <div class="fgroup">
          <label>Combustível</label>
          <div id="f-combustiveis"></div>
        </div>

        <div class="fgroup">
          <label for="f-preco">Faixa de preço</label>
          <div class="range-val"><span id="pmin">R$ 0</span><span id="pmax">R$ 0</span></div>
          <input type="range" id="f-preco" min="0" max="900000" step="10000" value="900000">
        </div>

        <div class="fgroup">
          <label for="f-ano">Ano mínimo</label>
          <div class="range-val"><span>A partir de</span><span id="anoval">2016</span></div>
          <input type="range" id="f-ano" min="2016" max="2027" step="1" value="2016">
        </div>

        <div class="fgroup">
          <label for="f-km">Km máximo</label>
          <div class="range-val"><span>Até</span><span id="kmval">Qualquer</span></div>
          <input type="range" id="f-km" min="0" max="80000" step="5000" value="80000">
        </div>

      <!-- MAIN -->
      <main id="conteudo">
        <div class="estoque-main-head">
          <div class="result-count" aria-live="polite" aria-atomic="true"><b id="rc">0</b> veículos encontrados</div>
          <div class="sort">
            <label for="f-sort">Ordenar por</label>
            <select id="f-sort">
              <option value="relevancia">Relevância</option>
              <option value="menor">Menor preço</option>
              <option value="maior">Maior preço</option>
              <option value="km">Menor km</option>
              <option value="ano">Mais novos</option>

  <script src="assets/data.js?v=estoque-webp-2"></script>
  <script src="assets/app.js?v=menu-order-20261112"></script>
  <script>
    renderChrome('estoque');

    const filterPanel = document.getElementById('stock-refinements');
    const wideFilters = window.matchMedia('(min-width: 861px)');
    const syncFilterPanel = () => { filterPanel.open = wideFilters.matches; };
    syncFilterPanel();
    wideFilters.addEventListener('change', syncFilterPanel);

    const limites = { preco: Math.ceil(Math.max(...CARROS.map(c => c.preco)) / 10000) * 10000, ano: Math.min(...CARROS.map(c => c.ano)), km: Math.ceil(Math.max(...CARROS.map(c => c.km ?? 0)) / 5000) * 5000 };
    const state = { search:'', marcas:new Set(), carrocerias:new Set(), combustiveis:new Set(), preco:limites.preco, ano:limites.ano, km:limites.km, sort:'relevancia' };

    // pré-preenche via querystring vindo da home
    const qs = new URLSearchParams(location.search);
    if (qs.get('marca')) state.marcas.add(qs.get('marca'));
    if (qs.get('carroceria')) state.carrocerias.add(qs.get('carroceria'));
    if (qs.get('precoMax')) state.preco = +qs.get('precoMax');

    // helper contagem
    const countBy = (key, val) => CARROS.filter(c => c[key] === val).length;

    // render checkbox groups
    function checkGroup(containerId, list, stateSet, key) {
      document.getElementById(containerId).innerHTML = list.map(v =>
        `<label class="check"><input type="checkbox" value="${v}" ${stateSet.has(v)?'checked':''}> ${v} <span class="cnt">${countBy(key,v)}</span></label>`
      ).join('');
      document.getElementById(containerId).querySelectorAll('input').forEach(inp => {
        inp.addEventListener('change', () => {
          inp.checked ? stateSet.add(inp.value) : stateSet.delete(inp.value);
          render();
        });
      });
    }
    checkGroup('f-marcas', MARCAS, state.marcas, 'marca');
    checkGroup('f-carrocerias', CARROCERIAS, state.carrocerias, 'carroceria');
    checkGroup('f-combustiveis', COMBUSTIVEIS, state.combustiveis, 'combustivel');

    // sliders
    const pEl = document.getElementById('f-preco'); pEl.max = limites.preco; pEl.value = state.preco;
    const aEl = document.getElementById('f-ano'); aEl.min = limites.ano; aEl.max = Math.max(...CARROS.map(c => c.ano)); aEl.value = state.ano;
    const kEl = document.getElementById('f-km'); kEl.max = limites.km; kEl.value = state.km;
    pEl.addEventListener('input', () => { state.preco = +pEl.value; render(); });
    aEl.addEventListener('input', () => { state.ano = +aEl.value; render(); });
    kEl.addEventListener('input', () => { state.km = +kEl.value; render(); });
    document.getElementById('f-search').addEventListener('input', e => { state.search = e.target.value.toLowerCase(); render(); });
    document.getElementById('f-sort').addEventListener('change', e => { state.sort = e.target.value; render(); });
    document.getElementById('clear-filters').addEventListener('click', () => {
      state.search=''; state.marcas.clear(); state.carrocerias.clear(); state.combustiveis.clear();
      state.preco=limites.preco; state.ano=limites.ano; state.km=limites.km; state.sort='relevancia';
      document.getElementById('f-search').value=''; pEl.value=limites.preco; aEl.value=limites.ano; kEl.value=limites.km;
      document.getElementById('f-sort').value='relevancia';
      document.querySelectorAll('.filters input[type=checkbox]').forEach(i=>i.checked=false);
      render();
    });

    function matches(c) {
      if (state.search) {
        const hay = (c.marca+' '+c.modelo+' '+c.versao+' '+c.carroceria+' '+c.combustivel).toLowerCase();
        if (!hay.includes(state.search)) return false;
      }
      if (state.marcas.size && !state.marcas.has(c.marca)) return false;
      if (state.carrocerias.size && !state.carrocerias.has(c.carroceria)) return false;
      if (state.combustiveis.size && !state.combustiveis.has(c.combustivel)) return false;
      if (c.preco > state.preco) return false;
      if (c.ano < state.ano) return false;
      if (state.km < limites.km && (c.km == null || c.km > state.km)) return false;
      return true;
    }

    function sortList(list) {
      const s = state.sort;
      const arr = [...list];
      if (s==='menor') arr.sort((a,b)=>a.preco-b.preco);
      else if (s==='maior') arr.sort((a,b)=>b.preco-a.preco);
      else if (s==='km') arr.sort((a,b)=>(a.km ?? Infinity)-(b.km ?? Infinity));
      else if (s==='ano') arr.sort((a,b)=>b.ano-a.ano);
      else arr.sort((a,b)=>(b.destaque?1:0)-(a.destaque?1:0));
      return arr;
    }

    function activeChips() {
      const chips = [];
      state.marcas.forEach(m => chips.push(['marca',m]));
      state.carrocerias.forEach(m => chips.push(['carroceria',m]));
      state.combustiveis.forEach(m => chips.push(['combustivel',m]));
      if (state.preco < limites.preco) chips.push(['preco', 'Até '+fmtPrice(state.preco)]);
      if (state.ano > limites.ano) chips.push(['ano', 'A partir de '+state.ano]);
      if (state.km < limites.km) chips.push(['km', 'Até '+state.km.toLocaleString('pt-BR')+' km']);
      const box = document.getElementById('active-filters');
      box.innerHTML = chips.map(([k,v]) => `<span class="fchip">${v} <button data-k="${k}" data-v="${v}">✕</button></span>`).join('');
      box.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
        const k=b.dataset.k, v=b.dataset.v;
        if (k==='marca') state.marcas.delete(v);
        else if (k==='carroceria') state.carrocerias.delete(v);
        else if (k==='combustivel') state.combustiveis.delete(v);
        else if (k==='preco') { state.preco=limites.preco; pEl.value=limites.preco; }
        else if (k==='ano') { state.ano=limites.ano; aEl.value=limites.ano; }
        else if (k==='km') { state.km=limites.km; kEl.value=limites.km; }
        document.querySelectorAll('.filters input[type=checkbox]').forEach(i=>{ if(i.value===v) i.checked=false; });
        render();
      }));
    }

    function render() {
      document.getElementById('pmin').textContent = 'R$ 0';
      document.getElementById('pmax').textContent = fmtPrice(state.preco);
      document.getElementById('anoval').textContent = state.ano;
      document.getElementById('kmval').textContent = state.km >= limites.km ? 'Qualquer' : state.km.toLocaleString('pt-BR')+' km';

      const list = sortList(CARROS.filter(matches));
      document.getElementById('rc').textContent = list.length;
      const grid = document.getElementById('grid');
      grid.innerHTML = list.length ? list.map(carCard).join('')
        : `<div class="empty" style="grid-column:1/-1"><h3>Nenhum veículo encontrado</h3><p>Ajuste os filtros para ver mais opções.</p></div>`;
      activeChips();
      initMotion(); // re-observa os cards recém-inseridos (.reveal)
    }

    render();
  </script>
