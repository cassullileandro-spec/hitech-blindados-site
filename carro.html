<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>try{if(sessionStorage.getItem('htpre'))document.documentElement.classList.add('pre-skip')}catch(e){}</script>
  <title>Veículo Blindado NIII-A — Hi-Tech Blindados</title>
  <meta name="description" content="Veículo blindado nível NIII-A à venda na Hi-Tech Blindados, São Paulo. Ficha técnica completa, galeria de fotos, simulação de financiamento e proposta pelo WhatsApp.">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="theme-color" content="#F4F6F8">
  <script src="assets/theme.js?v=cards-frios-20261111-r10"></script>
  <meta name="geo.region" content="BR-SP">
  <meta name="geo.placename" content="São Paulo">
  <link rel="icon" type="image/webp" href="assets/media/logo-hitech.webp">

  <meta property="og:type" content="product">
  <meta property="og:site_name" content="Hi-Tech Blindados">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Veículo Blindado NIII-A — Hi-Tech Blindados">
  <meta property="og:description" content="Veículo blindado nível NIII-A à venda na Hi-Tech Blindados, São Paulo.">
  <meta property="og:image" content="https://cassullileandro-spec.github.io/hitech-blindados-site/assets/media/estoque/caoa-chery-tiggo-7-pro/01.webp">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.hitechblindados.com.br">
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="assets/styles.css?v=header-sem-orcamento-20261112">
  <link rel="stylesheet" href="assets/institucional.css?v=carrosseis-20261111">
</head>
<body class="vehicle-page">
  <a href="#conteudo" class="skip-link">Ir para o conteúdo</a>
  <div class="preloader" id="preloader" role="status" aria-label="Carregando">
    <div class="pre-logo-wrap">
      <img class="pre-base" src="assets/media/logo-hitech.webp" alt="Hi-Tech Blindados" width="250" height="128">
      <img class="pre-fill" src="assets/media/logo-hitech.webp" alt="" aria-hidden="true" width="250" height="128">
    </div>
  </div>

  <div id="site-header"></div>

  <main class="wrap" id="conteudo">
    <div class="breadcrumb" style="margin-top:26px" id="crumb"></div>
    <div id="pdp"></div>
  </main>

  <!-- Relacionados -->
  <section class="section">
    <div class="wrap">
      <div class="section-head"><div class="st-l"><h2>Veículos <span class="serif">semelhantes.</span></h2></div>
      <a href="estoque.html" class="tlink" id="rel-all"></a></div>
      <div class="grid-cars" id="relacionados"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="assets/data.js?v=estoque-webp-2"></script>
  <script src="assets/galerias.js?v=estoque-webp-2"></script>
  <script src="assets/app.js?v=showroom-20261112"></script>
  <script>
    renderChrome();
    document.getElementById('rel-all').innerHTML = 'Ver showroom ' + I.arrow;

    const id = new URLSearchParams(location.search).get('id') || CARROS[0].id;
    const c = CARROS.find(x => x.id === id);
    if (!c) {
      document.title = 'Veículo indisponível — Hi-Tech Blindados';
      document.getElementById('pdp').innerHTML = '<h1>Veículo indisponível.</h1><p>Este anúncio não está no showroom atual.</p><a class="btn btn-primary" href="estoque.html">Explorar showroom atual</a>';
      document.getElementById('relacionados').closest('section').hidden = true;
    } else {
    const protecao = armorLabel(c);
    document.title = `${c.marca} ${c.modelo} — ${protecao} — Hi-Tech Blindados`;

    document.getElementById('crumb').innerHTML =
      `<a href="index.html">Início</a> / <a href="estoque.html">Showroom</a> / <span>${c.marca} ${c.modelo}</span>`;

    // galeria: fotos reais do carro (galerias.js) — senão a foto principal
    const gAll = (typeof GALERIAS !== 'undefined' && GALERIAS[c.id]) ? GALERIAS[c.id].slice() : (c.gallery && c.gallery.length ? c.gallery.slice() : []);
    const gallery = gAll.length ? gAll : [c.img];
    const imageThumbnail = url => (typeof FOTO_MINIATURAS !== 'undefined' && FOTO_MINIATURAS[url]) || url;

    // ===== SEO/GEO por veículo: meta dinâmico + JSON-LD (Vehicle/Product) =====
    (function seo() {
      const url = `https://cassullileandro-spec.github.io/hitech-blindados-site/carro.html?id=${c.id}`;
      const desc = `${c.marca} ${c.modelo} ${c.versao}, ${protecao}, ${c.ano}, ${fmtKm(c.km)}, ${c.cambio || 'Câmbio sob consulta'}, ${c.combustivel}. À venda por ${fmtPrice(c.preco)} na Hi-Tech Blindados, São Paulo. ${c.resumo}`;
      const setMeta = (sel, val) => { const el = document.querySelector(sel); if (el) el.setAttribute('content', val); };
      setMeta('meta[name="description"]', desc);
      setMeta('meta[property="og:title"]', `${c.marca} ${c.modelo} — ${protecao} — ${fmtPrice(c.preco)}`);
      setMeta('meta[property="og:description"]', desc);
      setMeta('meta[property="og:image"]', new URL(gallery[0], url).href);
      setMeta('meta[name="twitter:card"]', 'summary_large_image');
      let og = document.querySelector('meta[property="og:url"]');
      if (!og) { og = document.createElement('meta'); og.setAttribute('property','og:url'); document.head.appendChild(og); }
      og.setAttribute('content', url);
      let can = document.createElement('link'); can.rel = 'canonical'; can.href = url; document.head.appendChild(can);

      const fuelMap = { 'Gasolina':'Gasoline','Flex':'Flex','Diesel':'Diesel','Híbrido':'Hybrid','Elétrico':'Electric' };
      const ld = {
        "@context": "https://schema.org",
        "@type": "Vehicle",
        "name": `${c.marca} ${c.modelo} — ${protecao}`,
        "description": desc,
        "brand": { "@type": "Brand", "name": c.marca },
        "model": c.modelo,
        "vehicleConfiguration": c.versao,
        "vehicleModelDate": String(c.ano),
        "bodyType": c.carroceria,
        "fuelType": fuelMap[c.combustivel] || c.combustivel,
        "vehicleTransmission": c.cambio || undefined,
        "mileageFromOdometer": c.km == null ? undefined : { "@type": "QuantitativeValue", "value": c.km, "unitCode": "KMT" },
        "image": gallery.map(image => new URL(image, url).href),
        "url": url,
        "itemCondition": c.condicao === "Novo" ? "https://schema.org/NewCondition" : "https://schema.org/UsedCondition",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "BRL",
          "price": c.preco,
          "availability": "https://schema.org/InStock",
          "itemCondition": c.condicao === "Novo" ? "https://schema.org/NewCondition" : "https://schema.org/UsedCondition",
          "url": url,
          "seller": { "@type": "AutoDealer", "name": "Hi-Tech Blindados", "telephone": "+551132027777", "areaServed": "São Paulo" }
        },
        "additionalProperty": [
          { "@type": "PropertyValue", "name": "Blindagem", "value": protecao }
        ]
      };
      const bc = {
        "@context": "https://schema.org", "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Início", "item": "https://cassullileandro-spec.github.io/hitech-blindados-site/" },
          { "@type": "ListItem", "position": 2, "name": "Showroom", "item": "https://cassullileandro-spec.github.io/hitech-blindados-site/estoque.html" },
          { "@type": "ListItem", "position": 3, "name": `${c.marca} ${c.modelo}`, "item": url }
        ]
      };
      [ld, bc].forEach(obj => {
        const s = document.createElement('script');
        s.type = 'application/ld+json';
        s.textContent = JSON.stringify(obj);
        document.head.appendChild(s);
      });
    })();

    const specs = [
      [I.calendar, 'Ano', c.ano],
      [I.gauge, 'Quilometragem', fmtKm(c.km)],
      [I.gear, 'Câmbio', c.cambio || 'Sob consulta'],
      [I.fuel, 'Combustível', c.combustivel],
      [I.shield, 'Blindagem', protecao],
      [I.tag, 'Condição', c.condicao],
    ];

    const parcela = parcelaEstimada(c.preco);

    document.getElementById('pdp').innerHTML = `
      <div class="pdp-lead reveal">
        <h1>${c.marca} ${c.modelo}</h1>
        <p class="pdp-ver">${c.versao}</p>
      </div>

      <div class="pdp">
      <div class="pdp-main">
        <figure class="pdp-gallery reveal">
          <div class="pg-main" id="pg-main">
            <span class="badge">${c.blindado === true ? I.shield : I.tag} ${protecao}</span>
            ${gallery.length > 1 ? `<button class="pg-nav pg-prev" id="pg-prev" aria-label="Anterior">${I.chevronL}</button>
            <button class="pg-nav pg-next" id="pg-next" aria-label="Próxima">${I.chevronR}</button>
            <div class="pg-count"><span id="pg-i">1</span> / ${gallery.length}</div>
            <button class="pg-expand" id="pg-expand">${I.expand} Ver fotos</button>` : ''}
            <img id="pg-img" src="${gallery[0]}" alt="${c.marca} ${c.modelo}" fetchpriority="high" width="1200" height="800">
          </div>
          ${gallery.length > 1 ? `<div class="pg-thumbs" id="pg-thumbs">
            ${gallery.map((u,i)=>`<button class="pg-thumb ${i===0?'active':''}" data-i="${i}" aria-label="Ver foto ${i+1}" aria-pressed="${i===0}"><img loading="lazy" src="${imageThumbnail(u)}" alt="" decoding="async"></button>`).join('')}
          </div>` : `<div class="gallery-note">${I.camera} Uma foto disponível neste anúncio · consulte mais imagens</div>`}
        </figure>

        <section class="pdp-block reveal">
          <div class="pdp-block-head"><h2>Especificações.</h2></div>
          <div class="spec-grid">
            ${specs.map(([ic,l,v])=>`<div class="spec">${ic}<span>${l}</span><b>${v}</b></div>`).join('')}
          </div>
        </section>

        ${c.blindado === true ? `<section class="pdp-block reveal">
          <div class="pdp-block-head"><h2>${c.nivel ? `Proteção nível <span class="serif">${c.nivel}</span>.` : 'Blindagem do veículo.'}</h2></div>
          <div class="armor-hero">
            <div class="armor-copy">
              <p class="pdp-prose">Tecnologia Hi-Tech com materiais balísticos e atenção aos detalhes de aplicação. Consulte a ficha de blindagem deste veículo para conhecer os materiais, os certificados e as condições de garantia do projeto.</p>
              <div class="armor-feats">
                <div class="af">${I.shield}<div><b>Materiais balísticos</b><span>especificações conforme o projeto</span></div></div>
                <div class="af">${I.bolt}<div><b>Vidros balísticos</b><span>consulte os materiais deste veículo</span></div></div>
                <div class="af">${I.clock}<div><b>Garantia e revisões</b><span>cobertura e cuidados conforme a proposta</span></div></div>
              </div>
            </div>
          </div>
        </section>` : ''}

        <section class="pdp-block reveal">
          <div class="pdp-block-head"><h2>Sobre este <span class="serif">veículo.</span></h2></div>
          <p class="pdp-prose">${c.resumo || 'Entre em contato para conhecer os detalhes deste veículo.'}</p>
        </section>

        <section class="pdp-block reveal">
          <div class="pdp-block-head"><h2>Equipamentos &amp; conforto.</h2></div>
          <div class="opcionais">
            ${c.opcionais.length ? c.opcionais.map(o=>`<span class="op">${I.check} ${o}</span>`).join('') : '<p>Consulte os equipamentos deste veículo com nossa equipe.</p>'}
          </div>
        </section>
      </div>

      <!-- SIDEBAR -->
      <aside class="pdp-side">
        <div class="buy-card">
          <span class="cond">${I.check} ${c.condicao}</span>
          <div class="big-price">${fmtPrice(c.preco)}</div>
          <div class="parcela">ou a partir de <b>${fmtPrice(Math.round(parcela))}/mês</b> · 48x</div>
          <div class="buy-actions">
            <a href="${WA}" class="btn btn-wa btn-block btn-lg">${I.wa} Falar no WhatsApp</a>
            <a href="#proposta" class="btn btn-primary btn-block">Fazer uma proposta</a>
            <a href="tel:1132027777" class="btn btn-ghost btn-block">${I.phone} (11) 3202-7777</a>
          </div>
        </div>

        <div class="sim">
          <h3>Simule seu financiamento</h3>
          <span>Estimativa. Sujeito a análise de crédito.</span>
          <div class="sim-row">
            <label for="sim-e">Entrada <b id="sim-entrada">20%</b></label>
            <input type="range" id="sim-e" min="10" max="60" step="5" value="20">
          </div>
          <div class="sim-row">
            <label for="sim-p">Prazo <b id="sim-prazo">48x</b></label>
            <input type="range" id="sim-p" min="12" max="60" step="12" value="48">
          </div>
          <div class="sim-result">
            <span>Parcela estimada</span>
            <b id="sim-out">R$ 0</b>
            <small id="sim-fin"></small>
          </div>
        </div>

        <div class="buy-card" id="proposta">
          <h3>Faça uma proposta</h3>
          <form class="contact-form" id="proposal-form" action="https://wa.me/5511975548105" method="get">
            <label for="proposal-name">Seu nome</label>
            <input id="proposal-name" name="nome" autocomplete="name" maxlength="80" required>
            <label for="proposal-phone">Telefone / WhatsApp</label>
            <input id="proposal-phone" name="telefone" type="tel" autocomplete="tel" maxlength="30" required>
            <label for="proposal-email">E-mail <span class="optional">(opcional)</span></label>
            <input id="proposal-email" name="email" type="email" autocomplete="email" maxlength="120">
            <label for="proposal-message">Sua proposta ou dúvida</label>
            <textarea id="proposal-message" name="mensagem" maxlength="2000" rows="4"></textarea>
            <p class="fine-print">O WhatsApp será aberto para você revisar e enviar sua mensagem.</p>
            <button class="btn btn-primary btn-block btn-lg" type="submit">Continuar no WhatsApp</button>
          </form>
        </div>
      </aside>
      </div>`;

    document.getElementById('proposal-form').addEventListener('submit', event => {
      event.preventDefault();
      window.location.assign(proposalWhatsAppLink(new FormData(event.currentTarget), c));
    });

    // ===== Galeria estilo Webmotors (miniaturas + setas + lightbox) =====
    if (gallery.length > 1) {
      let idx = 0;
      const mainImg = document.getElementById('pg-img');
      const counter = document.getElementById('pg-i');
      const thumbs = [...document.querySelectorAll('#pg-thumbs .pg-thumb')];

      const lb = document.createElement('div');
      lb.className = 'lightbox';
      lb.innerHTML = `
        <div class="lb-top"><span class="lb-count"><b id="lb-i">1</b> / ${gallery.length} fotos</span><button class="lb-close" id="lb-close" aria-label="Fechar">${I.close}</button></div>
        <div class="lb-stage">
          <button class="lb-nav lb-prev" id="lb-prev" aria-label="Anterior">${I.chevronL}</button>
          <img id="lb-img" src="${gallery[0]}" alt="${c.marca} ${c.modelo}">
          <button class="lb-nav lb-next" id="lb-next" aria-label="Próxima">${I.chevronR}</button>
        </div>
        <div class="lb-thumbs" id="lb-thumbs">${gallery.map((u,i)=>`<button class="lb-thumb ${i===0?'active':''}" data-i="${i}" aria-label="Ver foto ${i+1}" aria-pressed="${i===0}"><img loading="lazy" src="${imageThumbnail(u)}" alt="" decoding="async"></button>`).join('')}</div>`;
      document.body.appendChild(lb);
      const lbImg = lb.querySelector('#lb-img'), lbCount = lb.querySelector('#lb-i');
      const lbThumbs = [...lb.querySelectorAll('.lb-thumb')];

      function show(i) {
        idx = (i + gallery.length) % gallery.length;
        mainImg.src = gallery[idx]; lbImg.src = gallery[idx];
        counter.textContent = idx + 1; lbCount.textContent = idx + 1;
        thumbs.forEach((t,j)=>{ t.classList.toggle('active', j===idx); t.setAttribute('aria-pressed', String(j===idx)); });
        lbThumbs.forEach((t,j)=>{ t.classList.toggle('active', j===idx); t.setAttribute('aria-pressed', String(j===idx)); });
        thumbs[idx]?.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
        lbThumbs[idx]?.scrollIntoView({inline:'center', block:'nearest'});
      }
      const openLb = () => { lb.classList.add('open'); document.body.style.overflow = 'hidden'; };
      const closeLb = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };

      document.getElementById('pg-prev').addEventListener('click', e=>{ e.stopPropagation(); show(idx-1); });
      document.getElementById('pg-next').addEventListener('click', e=>{ e.stopPropagation(); show(idx+1); });
      document.getElementById('pg-expand').addEventListener('click', e=>{ e.stopPropagation(); openLb(); });
      document.getElementById('pg-main').addEventListener('click', openLb);
      thumbs.forEach(t => t.addEventListener('click', ()=>show(+t.dataset.i)));
      lbThumbs.forEach(t => t.addEventListener('click', ()=>show(+t.dataset.i)));
      lb.querySelector('#lb-prev').addEventListener('click', ()=>show(idx-1));
      lb.querySelector('#lb-next').addEventListener('click', ()=>show(idx+1));
      lb.querySelector('#lb-close').addEventListener('click', closeLb);
      lb.addEventListener('click', e=>{ if (e.target === lb || e.target.classList.contains('lb-stage')) closeLb(); });
      document.addEventListener('keydown', e=>{
        if (!lb.classList.contains('open')) return;
        if (e.key === 'ArrowRight') show(idx+1);
        else if (e.key === 'ArrowLeft') show(idx-1);
        else if (e.key === 'Escape') closeLb();
      });
    }

    // simulador
    const se = document.getElementById('sim-e'), sp = document.getElementById('sim-p');
    function sim() {
      const e = +se.value, p = +sp.value;
      document.getElementById('sim-entrada').textContent = e + '%';
      document.getElementById('sim-prazo').textContent = p + 'x';
      const val = parcelaEstimada(c.preco, e, p);
      document.getElementById('sim-out').textContent = fmtPrice(Math.round(val));
      document.getElementById('sim-fin').textContent = `Entrada de ${fmtPrice(Math.round(c.preco*e/100))} · financia ${fmtPrice(Math.round(c.preco*(1-e/100)))}`;
    }
    se.addEventListener('input', sim); sp.addEventListener('input', sim); sim();

    // relacionados (mesma carroceria, exclui atual)
    let rel = CARROS.filter(x => x.id !== c.id && x.carroceria === c.carroceria);
    if (rel.length < 3) rel = CARROS.filter(x => x.id !== c.id);
    document.getElementById('relacionados').innerHTML = rel.slice(0,4).map(carCard).join('');

    // conteúdo da PDP é montado após o renderChrome inicial — re-observa os .reveal
    initMotion();
    }
  </script>
</body>
</html>
